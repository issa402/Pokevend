# ============================================================
# PokémonTool — Docker Compose (PostgreSQL-only edition)
# MongoDB removed — all data lives in PostgreSQL + Redis.
# Usage: docker-compose up --build
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL — The single source of truth for all data:
  #   users, watchlists, alerts, inventory, shows, cards,
  #   card_listings, price_history, deals
  # ----------------------------------------------------------
  postgres: #name of the host
    image: postgres:15-alpine
    container_name: pokemontool_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-pokemontool}
      POSTGRES_USER:     ${POSTGRES_USER:-pokemontool_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemontool_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d  # Auto-runs all .sql files on first start
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokemontool_user} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis — In-memory cache for search results, trending data,
  # and deal-of-the-day (avoids repeated DB queries)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pokemontool_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # RabbitMQ — Message queue between producer/consumer services
  # Management UI: http://localhost:15672 (guest/guest)
  # ----------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pokemontool_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"    # AMQP for services
      - "127.0.0.1:15672:15672"  # Web management dashboard
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  # PokeTCG / PokeAi — local PokemonTCG price lookup API
  # Internal URL from other containers: http://poketcg:8765
  # ----------------------------------------------------------
  poketcg:
    build:
      context: ../PokeTCG/pokeai-service/pokeai
      dockerfile: Dockerfile
    container_name: pokemontool_poketcg
    restart: unless-stopped
    expose:
      - "8765"
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # Go API Gateway — replaces Node.js (lower memory, single binary)
  # ----------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pokemontool_server
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      poketcg:
        condition: service_healthy
    environment:
      - POKETCG_BASE_URL=http://poketcg:8765
      - API_CONSUMER_BASE_URL=http://api-consumer:8001
      - ODOO_URL=http://shopify-odoo:8069
    networks:
      - default
      - odoo-bridge

  # ----------------------------------------------------------
  # Python API Consumer — eBay + TCGplayer data ingestion
  # ----------------------------------------------------------
  api-consumer:
    build:
      context: ./services/api-consumer
      dockerfile: Dockerfile
    container_name: pokemontool_api_consumer
    restart: unless-stopped
    env_file: .env
    environment:
      - GO_INTERNAL_URL=http://server:3001/api/internal/watchlist-targets
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------
  # Python Analytics Engine — Trend detection, deals, news
  # ----------------------------------------------------------
  analytics-engine:
    build:
      context: ./services/analytics-engine
      dockerfile: Dockerfile
    container_name: pokemontool_analytics
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ----------------------------------------------------------
  # Go Scraping Service — Facebook Marketplace & Mercari
  # ----------------------------------------------------------
  scraping-service:
    profiles: ["browser-scraping"]
    build:
      context: ./services/scraping-service
      dockerfile: Dockerfile
    container_name: pokemontool_scraper
    restart: unless-stopped
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - DISPLAY=:99  # Required for Playwright headless mode in container
    volumes:
      - playwright_browsers:/home/scrapeuser/.cache/ms-playwright
      - playwright_driver:/home/scrapeuser/.cache/ms-playwright-go

  # ----------------------------------------------------------
  # React Frontend — Nginx in production
  # ----------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pokemontool_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

#-----LOG STORAGE-----------

  loki:
    image: grafana/loki:2.9.0
    container_name: pokemontool_loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart:  unless-stopped


#-----------LOG SHIPPER------------

  promtail:
    image: grafana/promtail:2.9.0
    container_name: pokemontool_promtail
    user: root:root #give it root access so it can read docker logs
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

#------------VISUALIZER------------
  grafana:
    image: grafana/grafana:latest
    container_name: pokemontool_grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

    restart: unless-stopped
    volumes:
      - grafanadata:/var/lib/grafana

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: pokemontool_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - server
    restart: unless-stopped
# ----------------------------------------------------------
# Named volumes for persistent data
# ----------------------------------------------------------
networks:
  odoo-bridge:
    external: true
    name: pokemon-odoo-bridge

volumes:
  pgdata:
    external: true
    name: pokevend_pgdata      # PostgreSQL data
  redisdata:   # Redis AOF data
  rabbitmqdata: # RabbitMQ message logs
  playwright_browsers: # Playwright browser cache for scraping-service
  playwright_driver: # Playwright Go driver cache for scraping-service
  grafanadata:
  prometheusdata:
