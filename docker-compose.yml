version: "3.9"

# ============================================================
# PokémonTool — Docker Compose (PostgreSQL-only edition)
# MongoDB removed — all data lives in PostgreSQL + Redis.
# Usage: docker-compose up --build
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL — The single source of truth for all data:
  #   users, watchlists, alerts, inventory, shows, cards,
  #   card_listings, price_history, deals
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: pokemontool_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-pokemontool}
      POSTGRES_USER:     ${POSTGRES_USER:-pokemontool_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemontool_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d  # Auto-runs all .sql files on first start
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokemontool_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis — In-memory cache for search results, trending data,
  # and deal-of-the-day (avoids repeated DB queries)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pokemontool_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # RabbitMQ — Message queue between producer/consumer services
  # Management UI: http://localhost:15672 (guest/guest)
  # ----------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pokemontool_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "5672:5672"    # AMQP for services
      - "15672:15672"  # Web management dashboard
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  # Node.js API Gateway — REST API + SSE streaming
  # ----------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pokemontool_server
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./server:/app          # Live code reload in dev
      - /app/node_modules       # Preserve container node_modules

  # ----------------------------------------------------------
  # Python API Consumer — eBay + TCGplayer data ingestion
  # ----------------------------------------------------------
  api-consumer:
    build:
      context: ./services/api-consumer
      dockerfile: Dockerfile
    container_name: pokemontool_api_consumer
    restart: unless-stopped
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------
  # Python Analytics Engine — Trend detection, deals, news
  # ----------------------------------------------------------
  analytics-engine:
    build:
      context: ./services/analytics-engine
      dockerfile: Dockerfile
    container_name: pokemontool_analytics
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ----------------------------------------------------------
  # Go Scraping Service — Facebook Marketplace & Mercari
  # ----------------------------------------------------------
  scraping-service:
    build:
      context: ./services/scraping-service
      dockerfile: Dockerfile
    container_name: pokemontool_scraper
    restart: unless-stopped
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - DISPLAY=:99  # Required for Playwright headless mode in container

  # ----------------------------------------------------------
  # React Frontend — Nginx in production
  # ----------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pokemontool_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

# ----------------------------------------------------------
# Named volumes for persistent data
# ----------------------------------------------------------
volumes:
  pgdata:      # PostgreSQL data
  redisdata:   # Redis AOF data
  rabbitmqdata: # RabbitMQ message logs
